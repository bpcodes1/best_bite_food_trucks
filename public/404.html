<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Best Bite Food Park</title>
    <!--
      GitHub Pages serves this for any unknown path (i.e. any client-side route
      other than "/"). It re-encodes the path into a query string and redirects
      to the app root, where the inline script in index.html decodes it and
      restores the real URL via history.replaceState so React Router picks it up.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
