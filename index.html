<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Restores the real route after public/404.html redirects here for a GitHub Pages deep link. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Site is still pre-launch (placeholder phone/email, business info not
         finalized) — keep it out of search results until it's ready to go
         live for real. Remove this line at launch. -->
