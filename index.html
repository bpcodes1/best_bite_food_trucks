<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      No <title> or <meta name="description"> here on purpose: every page
      declares its own via <Seo>, and pre-rendering writes them into each built
      file. A default here would leave two of each in every page, and the
      generic one would win.

      Fonts are self-hosted via fontsource and imported from src/index.css,
      so there is no render-blocking Google Fonts request here.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
